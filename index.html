<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10131c">
<title>PokéScan – von Janosch K.</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--bg:#10131c;--panel:#1b2030;--text:#f4f5fa;--muted:#aab1c5;--accent:#7c8cff;--border:#30384d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 5%;border-bottom:1px solid var(--border);gap:14px;flex-wrap:wrap}
.brand{font-size:25px;font-weight:bold}.brand span{color:var(--accent)}
.byline{font-size:12px;color:var(--muted);margin-top:4px}
select,button,input{padding:12px;border-radius:9px;border:1px solid var(--border);background:#252c40;color:white;font-size:15px}
button{cursor:pointer;background:var(--accent);border:0;font-weight:bold}
button:disabled{opacity:.45;cursor:not-allowed}
button:hover:not(:disabled){filter:brightness(1.12)}
main{max-width:1100px;margin:25px auto;padding:0 16px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:20px;margin-bottom:20px}
h2{margin-top:0;font-size:23px}
input[type=text]{width:100%}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
#video,#preview{width:100%;max-height:420px;object-fit:contain;background:#080a10;border-radius:12px;margin-top:12px}
#video,#preview{display:none}
.status{color:var(--muted);margin-top:12px;line-height:1.45}
.small{font-size:13px;color:var(--muted);line-height:1.45}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px;margin-top:15px}
.card{background:#252c40;border:1px solid var(--border);border-radius:12px;padding:10px;cursor:pointer;min-width:0}
.card:hover,.card.selected{border:2px solid var(--accent);padding:9px}
.card img{width:100%;aspect-ratio:3/4;object-fit:contain;border-radius:8px;background:#151a27}
.card p{margin:8px 0 4px;font-weight:bold;overflow-wrap:anywhere}
.card .small{display:block}
#details{display:none}
#detailContent{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
#detailContent img{max-width:190px;width:42%;border-radius:12px}
.detailText{flex:1;min-width:180px}
#collection .card{cursor:default}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 20px 30px}
@media(max-width:520px){header{padding:15px}.panel{padding:16px}h2{font-size:20px}.results{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <div>
    <div class="brand">Poké<span>Scan</span></div>
    <div class="byline">von Janosch K.</div>
  </div>
  <select id="siteLanguage" aria-label="Website language">
    <option value="de">Deutsch</option><option value="en">English</option>
    <option value="fr">Français</option><option value="es">Español</option>
    <option value="it">Italiano</option><option value="pt">Português</option>
  </select>
</header>
<main>
<section class="panel">
  <h2 data-i18n="scanner">Pokémon-Karte scannen</h2>
  <p data-i18n="scanHint">Fotografiere eine Karte oder lade ein Bild hoch.</p>
  <div class="actions">
    <button id="startCamera" data-i18n="camera">Kamera starten</button>
    <button id="takePhoto" data-i18n="photo" disabled>Foto aufnehmen</button>
    <button id="stopCamera" data-i18n="stop">Kamera stoppen</button>
    <button id="uploadButton" data-i18n="upload">Bild hochladen</button>
    <input id="upload" type="file" accept="image/*" hidden>
  </div>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" hidden></canvas>
  <img id="preview" alt="Kartenvorschau">
  <div class="actions"><button id="recognize" data-i18n="recognize">Karte erkennen</button></div>
  <p class="status" id="ocrStatus" aria-live="polite"></p>
</section>
<section class="panel">
  <h2 data-i18n="search">Internationale Kartensuche</h2>
  <p class="small" data-i18n="searchHint">Bearbeite den erkannten Text oder gib selbst einen Namen ein.</p>
  <input id="searchInput" type="text" placeholder="Pokémon-Name oder Kartennummer">
  <div class="actions"><button id="searchButton" data-i18n="searchButton">Suchen</button></div>
  <p class="status" id="searchStatus" aria-live="polite"></p>
  <div id="results" class="results"></div>
</section>
<section class="panel" id="details">
  <h2 data-i18n="details">Kartendetails</h2>
  <div id="detailContent"></div>
  <div class="actions"><button id="saveCard" data-i18n="save">Zur Sammlung hinzufügen</button></div>
</section>
<section class="panel">
  <h2 data-i18n="collection">Meine Sammlung</h2>
  <p class="small" data-i18n="collectionHint">Deine Karten werden auf diesem Gerät gespeichert.</p>
  <div class="results" id="collection"></div>
  <div class="actions"><button id="clearCollection" data-i18n="clear">Sammlung löschen</button></div>
</section>
</main>
<footer>PokéScan · von Janosch K.</footer>
<script>
const translations={
de:{scanner:"Pokémon-Karte scannen",scanHint:"Fotografiere eine Karte oder lade ein Bild hoch.",camera:"Kamera starten",photo:"Foto aufnehmen",stop:"Kamera stoppen",upload:"Bild hochladen",recognize:"Karte erkennen",search:"Internationale Kartensuche",searchHint:"Bearbeite den erkannten Text oder gib selbst einen Namen ein.",searchButton:"Suchen",details:"Kartendetails",save:"Zur Sammlung hinzufügen",collection:"Meine Sammlung",collectionHint:"Deine Karten werden auf diesem Gerät gespeichert.",clear:"Sammlung löschen",working:"Erkennung läuft …",searching:"Internationale Kartendatenbanken werden durchsucht …",found:"Gefundene Karten – tippe eine Karte an:",none:"Keine passenden Karten gefunden. Probiere einen anderen Namen oder eine Kartennummer.",error:"Fehler:",saved:"Karte wurde zur Sammlung hinzugefügt.",empty:"Noch keine Karten gespeichert.",cameraError:"Kamera konnte nicht gestartet werden. Prüfe die Kamerafreigabe.",noImage:"Bitte zuerst ein Foto aufnehmen oder ein Bild hochladen.",number:"Kartennummer",set:"Set",db:"Datenbanksprache",price:"Preisinfo",select:"Karte auswählen",selected:"Ausgewählte Karte"},
en:{scanner:"Scan a Pokémon card",scanHint:"Take a photo or upload a card image.",camera:"Start camera",photo:"Take photo",stop:"Stop camera",upload:"Upload image",recognize:"Recognize card",search:"International card search",searchHint:"Edit the recognized text or enter a name yourself.",searchButton:"Search",details:"Card details",save:"Add to collection",collection:"My collection",collectionHint:"Your cards are saved on this device.",clear:"Clear collection",working:"Recognition in progress …",searching:"Searching international card databases …",found:"Matching cards – tap a card:",none:"No matching cards found. Try another name or card number.",error:"Error:",saved:"Card added to your collection.",empty:"No cards saved yet.",cameraError:"Could not start camera. Check camera permissions.",noImage:"Please take a photo or upload an image first.",number:"Card number",set:"Set",db:"Database language",price:"Price info",select:"Select card",selected:"Selected card"},
fr:{scanner:"Scanner une carte Pokémon",scanHint:"Prenez une photo ou importez une image.",camera:"Démarrer la caméra",photo:"Prendre une photo",stop:"Arrêter la caméra",upload:"Importer une image",recognize:"Reconnaître la carte",search:"Recherche internationale",searchHint:"Modifiez le texte reconnu ou saisissez un nom.",searchButton:"Rechercher",details:"Détails de la carte",save:"Ajouter à la collection",collection:"Ma collection",collectionHint:"Vos cartes sont enregistrées sur cet appareil.",clear:"Vider la collection",working:"Reconnaissance en cours …",searching:"Recherche dans les bases internationales …",found:"Cartes correspondantes – touchez une carte :",none:"Aucune carte trouvée.",error:"Erreur :",saved:"Carte ajoutée.",empty:"Aucune carte enregistrée.",cameraError:"Impossible de démarrer la caméra.",noImage:"Prenez ou importez d'abord une image.",number:"Numéro",set:"Extension",db:"Langue des données",price:"Prix",select:"Choisir",selected:"Carte choisie"},
es:{scanner:"Escanear una carta Pokémon",scanHint:"Haz una foto o sube una imagen.",camera:"Iniciar cámara",photo:"Tomar foto",stop:"Detener cámara",upload:"Subir imagen",recognize:"Reconocer carta",search:"Búsqueda internacional",searchHint:"Edita el texto reconocido o escribe un nombre.",searchButton:"Buscar",details:"Detalles de la carta",save:"Añadir a colección",collection:"Mi colección",collectionHint:"Tus cartas se guardan en este dispositivo.",clear:"Borrar colección",working:"Reconociendo …",searching:"Buscando en bases de datos internacionales …",found:"Cartas encontradas – toca una:",none:"No se encontraron cartas.",error:"Error:",saved:"Carta guardada.",empty:"Todavía no hay cartas.",cameraError:"No se pudo iniciar la cámara.",noImage:"Primero toma o sube una imagen.",number:"Número",set:"Colección",db:"Idioma de datos",price:"Precio",select:"Elegir carta",selected:"Carta seleccionada"},
it:{scanner:"Scansiona una carta Pokémon",scanHint:"Scatta una foto o carica un'immagine.",camera:"Avvia fotocamera",photo:"Scatta foto",stop:"Ferma fotocamera",upload:"Carica immagine",recognize:"Riconosci carta",search:"Ricerca internazionale",searchHint:"Modifica il testo riconosciuto o inserisci un nome.",searchButton:"Cerca",details:"Dettagli carta",save:"Aggiungi alla collezione",collection:"La mia collezione",collectionHint:"Le carte sono salvate su questo dispositivo.",clear:"Cancella collezione",working:"Riconoscimento in corso …",searching:"Ricerca nei database internazionali …",found:"Carte trovate – seleziona una carta:",none:"Nessuna carta trovata.",error:"Errore:",saved:"Carta salvata.",empty:"Nessuna carta salvata.",cameraError:"Impossibile avviare la fotocamera.",noImage:"Scatta o carica prima un'immagine.",number:"Numero",set:"Espansione",db:"Lingua dei dati",price:"Prezzo",select:"Scegli carta",selected:"Carta selezionata"},
pt:{scanner:"Digitalizar carta Pokémon",scanHint:"Tire uma foto ou envie uma imagem.",camera:"Iniciar câmera",photo:"Tirar foto",stop:"Parar câmera",upload:"Enviar imagem",recognize:"Reconhecer carta",search:"Pesquisa internacional",searchHint:"Edite o texto reconhecido ou digite um nome.",searchButton:"Pesquisar",details:"Detalhes da carta",save:"Adicionar à coleção",collection:"Minha coleção",collectionHint:"As cartas são guardadas neste dispositivo.",clear:"Limpar coleção",working:"Reconhecimento em andamento …",searching:"Pesquisando em bases internacionais …",found:"Cartas encontradas – toque numa carta:",none:"Nenhuma carta encontrada.",error:"Erro:",saved:"Carta guardada.",empty:"Ainda não há cartas.",cameraError:"Não foi possível iniciar a câmera.",noImage:"Tire ou envie uma imagem primeiro.",number:"Número",set:"Coleção",db:"Idioma dos dados",price:"Preço",select:"Escolher carta",selected:"Carta selecionada"}
};
let siteLang=localStorage.getItem("pokescan_language")||"de",stream=null,currentImage=null,selectedCard=null,databaseCache={};
const $=id=>document.getElementById(id),t=k=>translations[siteLang]?.[k]||translations.de[k]||k;
const locales=["en","de","fr","es","it","pt","ja","ko","zh-tw","zh-cn","id","th"];
function applyLanguage(){
 document.documentElement.lang=siteLang;
 document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
 $("searchInput").placeholder=siteLang==="de"?"Pokémon-Name oder Kartennummer":"Pokémon name or card number";
 renderCollection();
}
$("siteLanguage").value=siteLang;
$("siteLanguage").addEventListener("change",e=>{siteLang=e.target.value;localStorage.setItem("pokescan_language",siteLang);applyLanguage()});
async function startCamera(){
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error("Camera API unavailable");
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
  $("video").srcObject=stream;$("video").style.display="block";$("takePhoto").disabled=false;
  $("ocrStatus").textContent="";
 }catch(e){$("ocrStatus").textContent=t("cameraError")+" "+e.message}
}
function stopCamera(){if(stream)stream.getTracks().forEach(x=>x.stop());stream=null;$("video").style.display="none";$("takePhoto").disabled=true}
$("startCamera").onclick=startCamera;$("stopCamera").onclick=stopCamera;
function showImage(blob){
 if(!blob)return;currentImage=blob;
 if($("preview").dataset.url)URL.revokeObjectURL($("preview").dataset.url);
 const url=URL.createObjectURL(blob);$("preview").src=url;$("preview").dataset.url=url;$("preview").style.display="block";
 $("ocrStatus").textContent="";
}
$("takePhoto").onclick=()=>{
 const v=$("video"),c=$("canvas");if(!stream||!v.videoWidth){$("ocrStatus").textContent=t("cameraError");return}
 c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);
 c.toBlob(showImage,"image/jpeg",.95);
};
$("uploadButton").onclick=()=>$("upload").click();
$("upload").onchange=e=>{const f=e.target.files?.[0];if(f)showImage(f);e.target.value=""};
async function prepareImage(blob){
 const img=new Image(),url=URL.createObjectURL(blob);img.src=url;
 await new Promise((ok,no)=>{img.onload=ok;img.onerror=no});
 const c=document.createElement("canvas"),scale=Math.min(2,1800/Math.max(img.width,img.height));
 c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
 const x=c.getContext("2d");x.drawImage(img,0,0,c.width,c.height);
 const p=x.getImageData(0,0,c.width,c.height);
 for(let i=0;i<p.data.length;i+=4){let g=.299*p.data[i]+.587*p.data[i+1]+.114*p.data[i+2];g=Math.max(0,Math.min(255,(g-128)*1.25+128));p.data[i]=p.data[i+1]=p.data[i+2]=g}
 x.putImageData(p,0,0);URL.revokeObjectURL(url);return c;
}
$("recognize").onclick=async()=>{
 if(!currentImage){$("ocrStatus").textContent=t("noImage");return}
 $("ocrStatus").textContent=t("working");
 try{
  const c=await prepareImage(currentImage),worker=await Tesseract.createWorker(["eng","deu"]);
  const result=await worker.recognize(c);await worker.terminate();
  const lines=(result.data.text||"").split(/\n/).map(x=>x.trim()).filter(x=>/[A-Za-zÀ-ÿ]/.test(x)&&x.length>2);
  const candidate=lines.sort((a,b)=>b.length-a.length)[0]||"";
  $("searchInput").value=candidate.replace(/[^\p{L}\p{N}\s'-]/gu,"").trim();
  $("ocrStatus").textContent=candidate?("Erkannter Text: "+candidate+" – bitte prüfen und anschließend suchen."):"Kein eindeutiger Text erkannt. Bitte Kartennamen eingeben.";
 }catch(e){$("ocrStatus").textContent=t("error")+" "+e.message}
};
function norm(s){return String(s||"").toLocaleLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\p{L}\p{N}]/gu,"")}
async function loadDatabase(locale){
 if(databaseCache[locale])return databaseCache[locale];
 const r=await fetch(`https://api.tcgdex.net/v2/${locale}/cards`);
 if(!r.ok)throw new Error("API "+locale+" "+r.status);
 return databaseCache[locale]=await r.json();
}
$("searchButton").onclick=searchCards;
$("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")searchCards()});
async function searchCards(){
 const query=$("searchInput").value.trim();if(!query)return;
 $("searchStatus").textContent=t("searching");$("results").innerHTML="";$("details").style.display="none";selectedCard=null;
 const q=norm(query),found=new Map();
 // Suche in allen unterstützten Sprachdatenbanken; Ergebnisse werden anhand der Karten-ID zusammengeführt.
 for(const locale of locales){
  try{
   const cards=await loadDatabase(locale);
   for(const c of cards){
    const name=norm(c.name),id=norm(c.id),local=norm(c.localId);
    if(name.includes(q)||id.includes(q)||local===q){
     const key=c.id;
     if(!found.has(key))found.set(key,{...c,_locale:locale});
    }
   }
  }catch(err){console.warn("Locale skipped:",locale,err)}
 }
 const results=[...found.values()].slice(0,60);
 renderResults(results);
 $("searchStatus").textContent=results.length?`${t("found")} ${results.length}`:t("none");
}
function imageUrl(card,size="low"){return card.image?`${card.image}/${size}.webp`:null}
function renderResults(cards){
 const root=$("results");root.innerHTML="";
 cards.forEach(card=>{
  const item=document.createElement("button");item.type="button";item.className="card";item.style.textAlign="left";item.style.color="white";
  const src=imageUrl(card);
  if(src){const img=document.createElement("img");img.loading="lazy";img.src=src;img.alt=card.name||"Pokémon card";img.onerror=()=>img.style.display="none";item.appendChild(img)}
  const name=document.createElement("p");name.textContent=card.name||card.id;item.appendChild(name);
  const id=document.createElement("span");id.className="small";id.textContent=card.id;item.appendChild(id);
  const locale=document.createElement("span");locale.className="small";locale.textContent=" · "+card._locale;item.appendChild(locale);
  item.addEventListener("click",()=>selectCard(card));root.appendChild(item);
 });
}
async function selectCard(card){
 selectedCard=card;$("details").style.display="block";$("detailContent").textContent="…";
 $("details").scrollIntoView({behavior:"smooth",block:"start"});
 try{
  const r=await fetch(`https://api.tcgdex.net/v2/${card._locale}/cards/${encodeURIComponent(card.id)}`);
  const detail=r.ok?await r.json():card;selectedCard={...detail,_locale:card._locale};
  const root=$("detailContent");root.innerHTML="";
  const src=imageUrl(detail);
  if(src){const img=document.createElement("img");img.src=src;img.alt=detail.name||"Pokémon card";img.onerror=()=>img.style.display="none";root.appendChild(img)}
  const text=document.createElement("div");text.className="detailText";
  const h=document.createElement("h3");h.textContent=detail.name||detail.id;text.appendChild(h);
  const p=document.createElement("p");p.textContent=`${t("number")}: ${detail.localId||"—"} · ${t("set")}: ${detail.set?.name||"—"} · ${t("db")}: ${card._locale}`;text.appendChild(p);
  const price=detail.pricing?.cardmarket?.avg??detail.pricing?.tcgplayer?.normal?.marketPrice;
  if(price!=null){const pp=document.createElement("p");pp.textContent=`${t("price")}: ${price}`;text.appendChild(pp)}
  root.appendChild(text);
 }catch(e){$("detailContent").textContent=detailFallback(card)}
}
function detailFallback(card){return card.name||card.id}
$("saveCard").onclick=()=>{
 if(!selectedCard)return;
 const list=JSON.parse(localStorage.getItem("pokescan_collection")||"[]");
 if(!list.some(c=>c.id===selectedCard.id)){list.push(selectedCard);localStorage.setItem("pokescan_collection",JSON.stringify(list))}
 $("ocrStatus").textContent=t("saved");renderCollection();
};
function renderCollection(){
 const root=$("collection");if(!root)return;root.innerHTML="";
 const list=JSON.parse(localStorage.getItem("pokescan_collection")||"[]");
 if(!list.length){root.textContent=t("empty");return}
 list.forEach(card=>{
  const item=document.createElement("div");item.className="card";const src=imageUrl(card);
  if(src){const img=document.createElement("img");img.loading="lazy";img.src=src;img.alt=card.name||"Pokémon card";item.appendChild(img)}
  const p=document.createElement("p");p.textContent=card.name||card.id;item.appendChild(p);root.appendChild(item);
 });
}
$("clearCollection").onclick=()=>{
 if(confirm(siteLang==="de"?"Möchtest du deine Sammlung wirklich löschen?":"Are you sure you want to clear your collection?")){
  localStorage.removeItem("pokescan_collection");renderCollection();
 }
};
applyLanguage();renderCollection();
</script>
</body>
</html>
