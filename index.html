<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PokéScan – Von Janosch K.</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root {
  --bg:#10131c; --panel:#1b2030; --text:#f4f5fa;
  --muted:#aab1c5; --accent:#7c8cff; --border:#30384d;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:Arial,sans-serif;
}
header {
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 5%; border-bottom:1px solid var(--border);
  gap:15px; flex-wrap:wrap;
}
.brand { font-size:25px; font-weight:bold; }
.brand span { color:var(--accent); }
select,button,input {
  padding:12px; border-radius:9px; border:1px solid var(--border);
  background:#252c40; color:white; font-size:15px;
}
button { cursor:pointer; background:var(--accent); border:0; font-weight:bold; }
button:hover { filter:brightness(1.12); }
main { max-width:1100px; margin:25px auto; padding:0 16px; }
.panel {
  background:var(--panel); border:1px solid var(--border);
  border-radius:15px; padding:20px; margin-bottom:20px;
}
h2 { margin-top:0; }
input[type="text"] { width:100%; }
.actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
#video,#preview {
  width:100%; max-height:380px; object-fit:contain;
  background:#080a10; border-radius:12px; margin-top:12px;
}
#video { display:none; }
#preview { display:none; }
.status { color:var(--muted); margin-top:12px; }
.results {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:14px; margin-top:15px;
}
.card {
  background:#252c40; border:1px solid var(--border);
  border-radius:12px; padding:10px; cursor:pointer;
}
.card:hover { border-color:var(--accent); }
.card img { width:100%; border-radius:8px; }
.card p { margin:8px 0 2px; font-weight:bold; }
#details { display:none; }
#details img { max-width:220px; width:100%; border-radius:12px; }
.small { font-size:13px; color:var(--muted); }
</style>
</head>
<body>

<header>
  <div class="brand">Poké<span>Scan</span></div>
  <select id="siteLanguage" aria-label="Website language">
    <option value="de">Deutsch</option>
    <option value="en">English</option>
    <option value="fr">Français</option>
    <option value="es">Español</option>
    <option value="it">Italiano</option>
    <option value="pt">Português</option>
  </select>
</header>

<main>
  <section class="panel">
    <h2 data-i18n="scanner">Pokémon-Karte scannen</h2>
    <p data-i18n="scanHint">Fotografiere eine Karte oder lade ein Bild hoch.</p>
    <div class="actions">
      <button id="startCamera" data-i18n="camera">Kamera starten</button>
      <button id="takePhoto" data-i18n="photo" disabled>Foto aufnehmen</button>
      <button id="stopCamera" data-i18n="stop">Kamera stoppen</button>
      <label>
        <input id="upload" type="file" accept="image/*" hidden>
        <button type="button" id="uploadButton" data-i18n="upload">Bild hochladen</button>
      </label>
    </div>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" hidden></canvas>
    <img id="preview" alt="Kartenvorschau">
    <div class="actions">
      <button id="recognize" data-i18n="recognize">Karte erkennen</button>
    </div>
    <p class="status" id="ocrStatus"></p>
  </section>

  <section class="panel">
    <h2 data-i18n="search">Internationale Kartensuche</h2>
    <p class="small" data-i18n="searchHint">Du kannst den erkannten Text bearbeiten oder selbst einen Namen eingeben.</p>
    <input id="searchInput" type="text" placeholder="Pokémon-Name oder Kartennummer">
    <div class="actions">
      <button id="searchButton" data-i18n="searchButton">Suchen</button>
    </div>
    <p class="status" id="searchStatus"></p>
    <div class="results" id="results"></div>
  </section>

  <section class="panel" id="details">
    <h2 data-i18n="details">Kartendetails</h2>
    <div id="detailContent"></div>
    <div class="actions">
      <button id="saveCard" data-i18n="save">Zur Sammlung hinzufügen</button>
    </div>
  </section>

  <section class="panel">
    <h2 data-i18n="collection">Meine Sammlung</h2>
    <p class="small" data-i18n="collectionHint">Deine Karten werden auf diesem Gerät gespeichert.</p>
    <div class="results" id="collection"></div>
    <button id="clearCollection" data-i18n="clear">Sammlung löschen</button>
  </section>
</main>

<script>
const translations = {
 de:{
  scanner:"Pokémon-Karte scannen",
  scanHint:"Fotografiere eine Karte oder lade ein Bild hoch.",
  camera:"Kamera starten",photo:"Foto aufnehmen",stop:"Kamera stoppen",
  upload:"Bild hochladen",recognize:"Karte erkennen",
  search:"Internationale Kartensuche",
  searchHint:"Du kannst den erkannten Text bearbeiten oder selbst einen Namen eingeben.",
  searchButton:"Suchen",details:"Kartendetails",
  save:"Zur Sammlung hinzufügen",collection:"Meine Sammlung",
  collectionHint:"Deine Karten werden auf diesem Gerät gespeichert.",
  clear:"Sammlung löschen",working:"Erkennung läuft...",
  found:"Suchergebnisse:",none:"Keine passenden Karten gefunden.",
  error:"Es ist ein Fehler aufgetreten.",saved:"Karte gespeichert.",
  empty:"Noch keine Karten in deiner Sammlung.",
  cameraError:"Kamera konnte nicht gestartet werden.",
  noImage:"Bitte zuerst ein Bild aufnehmen oder hochladen.",
  number:"Kartennummer",set:"Set",language:"Datenbanksprache"
 },
 en:{
  scanner:"Scan a Pokémon card",scanHint:"Take a photo or upload a card image.",
  camera:"Start camera",photo:"Take photo",stop:"Stop camera",
  upload:"Upload image",recognize:"Recognize card",
  search:"International card search",
  searchHint:"Edit the recognized text or enter a name yourself.",
  searchButton:"Search",details:"Card details",save:"Add to collection",
  collection:"My collection",collectionHint:"Your cards are saved on this device.",
  clear:"Clear collection",working:"Recognition in progress...",
  found:"Search results:",none:"No matching cards found.",
  error:"An error occurred.",saved:"Card saved.",
  empty:"No cards in your collection yet.",
  cameraError:"Could not start camera.",
  noImage:"Please take or upload an image first.",
  number:"Card number",set:"Set",language:"Database language"
 },
 fr:{
  scanner:"Scanner une carte Pokémon",scanHint:"Prenez une photo ou importez une image.",
  camera:"Démarrer la caméra",photo:"Prendre une photo",stop:"Arrêter la caméra",
  upload:"Importer une image",recognize:"Reconnaître la carte",
  search:"Recherche internationale",searchHint:"Modifiez le texte reconnu ou saisissez un nom.",
  searchButton:"Rechercher",details:"Détails de la carte",
  save:"Ajouter à la collection",collection:"Ma collection",
  collectionHint:"Vos cartes sont enregistrées sur cet appareil.",
  clear:"Vider la collection",working:"Reconnaissance en cours...",
  found:"Résultats :",none:"Aucune carte trouvée.",
  error:"Une erreur est survenue.",saved:"Carte enregistrée.",
  empty:"Votre collection est vide.",cameraError:"Impossible de démarrer la caméra.",
  noImage:"Veuillez d'abord prendre ou importer une image.",
  number:"Numéro",set:"Extension",language:"Langue des données"
 },
 es:{
  scanner:"Escanear una carta Pokémon",scanHint:"Haz una foto o sube una imagen.",
  camera:"Iniciar cámara",photo:"Tomar foto",stop:"Detener cámara",
  upload:"Subir imagen",recognize:"Reconocer carta",
  search:"Búsqueda internacional",searchHint:"Edita el texto reconocido o escribe un nombre.",
  searchButton:"Buscar",details:"Detalles de la carta",
  save:"Añadir a colección",collection:"Mi colección",
  collectionHint:"Tus cartas se guardan en este dispositivo.",
  clear:"Borrar colección",working:"Reconociendo...",
  found:"Resultados:",none:"No se encontraron cartas.",
  error:"Se ha producido un error.",saved:"Carta guardada.",
  empty:"Todavía no hay cartas.",cameraError:"No se pudo iniciar la cámara.",
  noImage:"Primero toma o sube una imagen.",
  number:"Número",set:"Colección",language:"Idioma de datos"
 },
 it:{
  scanner:"Scansiona una carta Pokémon",scanHint:"Scatta una foto o carica un'immagine.",
  camera:"Avvia fotocamera",photo:"Scatta foto",stop:"Ferma fotocamera",
  upload:"Carica immagine",recognize:"Riconosci carta",
  search:"Ricerca internazionale",searchHint:"Modifica il testo riconosciuto o inserisci un nome.",
  searchButton:"Cerca",details:"Dettagli carta",
  save:"Aggiungi alla collezione",collection:"La mia collezione",
  collectionHint:"Le carte sono salvate su questo dispositivo.",
  clear:"Cancella collezione",working:"Riconoscimento in corso...",
  found:"Risultati:",none:"Nessuna carta trovata.",
  error:"Si è verificato un errore.",saved:"Carta salvata.",
  empty:"La collezione è vuota.",cameraError:"Impossibile avviare la fotocamera.",
  noImage:"Scatta o carica prima un'immagine.",
  number:"Numero",set:"Espansione",language:"Lingua dei dati"
 },
 pt:{
  scanner:"Digitalizar carta Pokémon",scanHint:"Tire uma foto ou envie uma imagem.",
  camera:"Iniciar câmera",photo:"Tirar foto",stop:"Parar câmera",
  upload:"Enviar imagem",recognize:"Reconhecer carta",
  search:"Pesquisa internacional",searchHint:"Edite o texto reconhecido ou digite um nome.",
  searchButton:"Pesquisar",details:"Detalhes da carta",
  save:"Adicionar à coleção",collection:"Minha coleção",
  collectionHint:"As cartas são guardadas neste dispositivo.",
  clear:"Limpar coleção",working:"Reconhecimento em andamento...",
  found:"Resultados:",none:"Nenhuma carta encontrada.",
  error:"Ocorreu um erro.",saved:"Carta guardada.",
  empty:"Ainda não há cartas.",cameraError:"Não foi possível iniciar a câmera.",
  noImage:"Tire ou envie uma imagem primeiro.",
  number:"Número",set:"Coleção",language:"Idioma dos dados"
 }
};

let siteLang = localStorage.getItem("pokescan_language") || "de";
let stream = null;
let currentImage = null;
let selectedCard = null;
let databaseCache = {};
let currentResults = [];

const $ = id => document.getElementById(id);
const t = key => translations[siteLang][key] || translations.de[key] || key;

function applyLanguage() {
  document.documentElement.lang = siteLang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  $("searchInput").placeholder =
    siteLang === "de" ? "Pokémon-Name oder Kartennummer" :
    siteLang === "fr" ? "Nom du Pokémon ou numéro" :
    siteLang === "es" ? "Nombre o número de carta" :
    siteLang === "it" ? "Nome Pokémon o numero" :
    siteLang === "pt" ? "Nome ou número da carta" :
    "Pokémon name or card number";
  renderCollection();
}
$("siteLanguage").value = siteLang;
$("siteLanguage").addEventListener("change", e => {
  siteLang = e.target.value;
  localStorage.setItem("pokescan_language",siteLang);
  applyLanguage();
});

function normalize(s) {
  return String(s || "").toLocaleLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^\p{L}\p{N}]/gu,"");
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"}},audio:false
    });
    $("video").srcObject = stream;
    $("video").style.display = "block";
    $("takePhoto").disabled = false;
  } catch(e) {
    alert(t("cameraError"));
  }
}
function stopCamera() {
  if(stream) stream.getTracks().forEach(track=>track.stop());
  stream = null;
  $("video").style.display = "none";
  $("takePhoto").disabled = true;
}
$("startCamera").onclick = startCamera;
$("stopCamera").onclick = stopCamera;

function showImage(blob) {
  currentImage = blob;
  $("preview").src = URL.createObjectURL(blob);
  $("preview").style.display = "block";
}
$("takePhoto").onclick = () => {
  const video=$("video"),canvas=$("canvas");
  if(!stream) return;
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  canvas.getContext("2d").drawImage(video,0,0);
  canvas.toBlob(blob=>showImage(blob),"image/jpeg",0.95);
};
$("uploadButton").onclick = ()=>$("upload").click();
$("upload").onchange = e => {
  const file=e.target.files[0];
  if(file) showImage(file);
};

async function prepareImage(blob) {
  const img = new Image();
  img.src = URL.createObjectURL(blob);
  await new Promise((resolve,reject)=>{
    img.onload=resolve; img.onerror=reject;
  });
  const canvas=document.createElement("canvas");
  const scale=Math.min(2,1800/Math.max(img.width,img.height));
  canvas.width=Math.round(img.width*scale);
  canvas.height=Math.round(img.height*scale);
  const ctx=canvas.getContext("2d");
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);
  for(let i=0;i<pixels.data.length;i+=4){
    const gray=0.299*pixels.data[i]+0.587*pixels.data[i+1]+0.114*pixels.data[i+2];
    const contrast=Math.max(0,Math.min(255,(gray-128)*1.25+128));
    pixels.data[i]=pixels.data[i+1]=pixels.data[i+2]=contrast;
  }
  ctx.putImageData(pixels,0,0);
  URL.revokeObjectURL(img.src);
  return canvas;
}

async function recognizeCard() {
  if(!currentImage) { alert(t("noImage")); return; }
  $("ocrStatus").textContent=t("working");
  try {
    const canvas=await prepareImage(currentImage);
    const worker=await Tesseract.createWorker(["eng","deu"]);
    const result=await worker.recognize(canvas);
    await worker.terminate();
    const text=result.data.text || "";
    const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
    const candidate=lines
      .filter(x=>/[A-Za-zÀ-ÿ]/.test(x) && x.length>2)
      .sort((a,b)=>b.length-a.length)[0] || "";
    $("searchInput").value=candidate.replace(/[^\p{L}\p{N}\s'-]/gu,"").trim();
    $("ocrStatus").textContent =
      candidate ? "Erkannter Text: "+candidate : "Kein eindeutiger Text erkannt. Bitte Namen eingeben.";
  } catch(e) {
    $("ocrStatus").textContent=t("error")+" "+e.message;
  }
}
$("recognize").onclick=recognizeCard;

const locales=["en","de","fr","es","it","pt","pt-br","ja","ko","zh-tw","zh-cn","id","th"];

async function loadDatabase(locale) {
  if(databaseCache[locale]) return databaseCache[locale];
  const response=await fetch(`https://api.tcgdex.net/v2/${locale}/cards`);
  if(!response.ok) throw new Error("Database unavailable: "+locale);
  const cards=await response.json();
  databaseCache[locale]=cards;
  return cards;
}

async function searchCards() {
  const query=$("searchInput").value.trim();
  if(!query) return;
  $("searchStatus").textContent="Searching international card databases...";
  $("results").innerHTML="";
  $("details").style.display="none";
  selectedCard=null;
  const q=normalize(query);
  const all=[];
  for(const locale of locales) {
    try {
      const cards=await loadDatabase(locale);
      for(const card of cards) {
        const name=normalize(card.name);
        const id=normalize(card.id);
        const localId=normalize(card.localId);
        if(name.includes(q) || id.includes(q) || localId===q) {
          all.push({...card,_locale:locale});
        }
      }
    } catch(e) {
      console.warn("Could not search locale",locale,e);
    }
  }
  const unique=new Map();
  all.forEach(card=>{
    if(!unique.has(card.id)) unique.set(card.id,card);
  });
  currentResults=[...unique.values()].slice(0,60);
  renderResults();
  $("searchStatus").textContent=currentResults.length
    ? t("found")+" "+currentResults.length
    : t("none");
}
$("searchButton").onclick=searchCards;
$("searchInput").addEventListener("keydown",e=>{
  if(e.key==="Enter") searchCards();
});

function cardImage(card) {
  return card.image ? card.image+"/low.webp" : "";
}
function renderResults() {
  const container=$("results");
  container.innerHTML="";
  currentResults.forEach(card=>{
    const div=document.createElement("div");
    div.className="card";
    const img=cardImage(card);
    div.innerHTML=`
      ${img?`<img loading="lazy" src="${img}" alt="">`:""}
      <p></p><span class="small"></span>`;
    div.querySelector("p").textContent=card.name || card.id;
    div.querySelector("span").textContent=card.id;
    div.onclick=()=>selectCard(card);
    container.appendChild(div);
  });
}

async function selectCard(card) {
  selectedCard=card;
  $("details").style.display="block";
  $("detailContent").textContent="Loading card details...";
  try {
    const response=await fetch(
      `https://api.tcgdex.net/v2/${card._locale}/cards/${encodeURIComponent(card.id)}`
    );
    const detail=response.ok?await response.json():card;
    selectedCard={...detail,_locale:card._locale};
    const img=cardImage(detail);
    const content=$("detailContent");
    content.innerHTML="";
    if(img) {
      const image=document.createElement("img");
      image.src=img; image.alt=detail.name || "Pokémon card";
      content.appendChild(image);
    }
    const heading=document.createElement("h3");
    heading.textContent=detail.name || detail.id;
    content.appendChild(heading);
    const info=document.createElement("p");
    info.textContent=
      `${t("number")}: ${detail.localId || "—"} | ${t("set")}: ${detail.set?.name || "—"} | ${t("language")}: ${card._locale}`;
    content.appendChild(info);
    const price=detail.pricing?.cardmarket?.avg ||
                detail.pricing?.tcgplayer?.normal?.marketPrice;
    if(price) {
      const p=document.createElement("p");
      p.textContent="Price data: "+price;
      content.appendChild(p);
    }
  } catch(e) {
    $("detailContent").textContent=card.name || card.id;
  }
}
$("saveCard").onclick=()=>{
  if(!selectedCard) return;
  const collection=JSON.parse(localStorage.getItem("pokescan_collection")||"[]");
  if(!collection.some(c=>c.id===selectedCard.id && c._locale===selectedCard._locale)){
    collection.push(selectedCard);
    localStorage.setItem("pokescan_collection",JSON.stringify(collection));
  }
  alert(t("saved"));
  renderCollection();
};

function renderCollection() {
  const collection=JSON.parse(localStorage.getItem("pokescan_collection")||"[]");
  const container=$("collection");
  container.innerHTML="";
  if(!collection.length) {
    container.textContent=t("empty");
    return;
  }
  collection.forEach(card=>{
    const div=document.createElement("div");
    div.className="card";
    const img=cardImage(card);
    div.innerHTML=img?`<img loading="lazy" src="${img}" alt=""><p></p>`:"<p></p>";
    div.querySelector("p").textContent=card.name || card.id;
    container.appendChild(div);
  });
}
$("clearCollection").onclick=()=>{
  if(confirm("Really clear your collection?")){
    localStorage.removeItem("pokescan_collection");
    renderCollection();
  }
};

applyLanguage();
renderCollection();
</script>
</body>
</html>
